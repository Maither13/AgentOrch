<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentOrch · 编排工作台</title>
<style>
  :root {
    --bg: #070c17;
    --panel: #0e1626;
    --panel-2: #121d31;
    --line: #1e2b47;
    --text: #e8eeff;
    --muted: #8fa1c4;
    --accent: #4f8cff;
    --accent-2: #8b5cf6;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --skip: #94a3b8;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(79,140,255,.15), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(139,92,246,.10), transparent 55%),
      var(--bg);
    color: var(--text); min-height: 100dvh;
  }
  [hidden] { display: none !important; }
  code, pre { font-family: "Cascadia Code", Consolas, monospace; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: rgba(7,12,23,.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    font-size: 18px; box-shadow: 0 6px 16px rgba(79,140,255,.35);
  }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
  .brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .top-stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted);
    white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
  .pill.run { color: var(--accent); border-color: rgba(79,140,255,.4); background: rgba(79,140,255,.1); }
  .pill.warn { color: var(--warn); border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.08); }
  .pill.err { color: var(--err); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); }
  .pill.pass { color: var(--ok); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
  .pill.skip { color: var(--skip); }

  button {
    font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 8px 14px; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: rgba(79,140,255,.55); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary {
    border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 600; box-shadow: 0 6px 16px rgba(79,140,255,.25);
  }

  /* ---------- 布局 ---------- */
  .shell { display: grid; grid-template-columns: 150px minmax(0,1fr); min-height: calc(100dvh - 65px); }
  .rail { border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 6px; }
  .rail button {
    text-align: left; border: 0; background: transparent; color: var(--muted); padding: 9px 12px;
    border-radius: 9px; font-size: 13.5px;
  }
  .rail button.active { background: rgba(79,140,255,.12); color: var(--text); font-weight: 600; }
  .rail button:hover { background: rgba(255,255,255,.04); }
  main { padding: 18px; min-width: 0; }

  .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  /* ---------- 画布 ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input[type="text"] {
    flex: 1; min-width: 260px; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 13.5px; outline: none;
  }
  .toolbar input:focus { border-color: rgba(79,140,255,.6); }
  .toolbar select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 9px 10px; font: inherit; font-size: 13px; outline: none;
  }
  .canvas-layout { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 14px; align-items: start; }
  .canvas-wrap { overflow: auto; padding: 8px; }
  #dag { display: block; width: 100%; height: auto; }
  .inspector { padding: 16px; min-height: 300px; }
  .inspector h3 { margin: 0 0 4px; font-size: 15px; }
  .inspector .role { color: var(--muted); font-size: 12px; }
  .inspector section { margin-top: 14px; }
  .inspector h4 {
    margin: 0 0 7px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); background: var(--panel-2);
  }
  .chip.on { color: var(--ok); border-color: rgba(52,211,153,.3); }
  .chip.off { opacity: .45; border-style: dashed; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 4px 0; }
  .kv span:first-child { color: var(--muted); }
  .preview {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px; font-size: 12px; line-height: 1.6; max-height: 200px; overflow: auto;
    white-space: pre-wrap; word-break: break-word; color: #c8d5ee;
  }

  /* ---------- SVG 节点 ---------- */
  .node { cursor: pointer; }
  .node rect.node-bg { fill: #0f1a2d; stroke: #243452; stroke-width: 1.2; transition: .2s; }
  .node:hover rect.node-bg { stroke: rgba(79,140,255,.7); }
  .node .node-title { fill: #e8eeff; font-size: 13.5px; font-weight: 600; }
  .node .node-sub { fill: #8fa1c4; font-size: 11px; }
  .node .node-dot { fill: #64748b; }
  .node.status-running rect.node-bg { stroke: rgba(79,140,255,.9); fill: rgba(79,140,255,.1); }
  .node.status-running .node-dot { fill: var(--accent); }
  .node.status-completed rect.node-bg { stroke: rgba(52,211,153,.55); fill: rgba(52,211,153,.08); }
  .node.status-completed .node-dot { fill: var(--ok); }
  .node.status-failed rect.node-bg { stroke: rgba(248,113,113,.6); fill: rgba(248,113,113,.08); }
  .node.status-failed .node-dot { fill: var(--err); }
  .node.status-skipped rect.node-bg { stroke: rgba(148,163,184,.4); fill: rgba(148,163,184,.06); }
  .node.status-skipped .node-dot { fill: var(--skip); }
  .node.selected rect.node-bg { stroke: #fff; stroke-width: 1.6; }
  .layer-label { fill: #55688c; font-size: 11px; letter-spacing: .1em; }
  .edge { fill: none; stroke: #2a3a5c; stroke-width: 1.5; }
  .edge.active { stroke: rgba(79,140,255,.65); }

  /* ---------- 团队 ---------- */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .agent-card { padding: 16px; }
  .agent-head { display: flex; gap: 12px; align-items: center; }
  .avatar {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg, rgba(79,140,255,.25), rgba(139,92,246,.25));
    border: 1px solid rgba(79,140,255,.3); font-size: 13px; font-weight: 700; color: #cfe0ff;
  }
  .agent-head h3 { margin: 0; font-size: 14.5px; }
  .agent-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .agent-desc { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin: 12px 0; }
  details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  details pre {
    white-space: pre-wrap; word-break: break-word; font-size: 11.5px; line-height: 1.6;
    color: #b9c8e4; background: var(--panel-2); border-radius: 8px; padding: 10px; margin: 8px 0 0;
    max-height: 220px; overflow: auto;
  }

  /* ---------- 运行 ---------- */
  .runs-layout { display: grid; grid-template-columns: 290px minmax(0,1fr); gap: 14px; align-items: start; }
  .run-list { padding: 10px; max-height: calc(100dvh - 140px); overflow: auto; }
  .run-item {
    width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
    border-radius: 10px; padding: 10px 11px; margin-bottom: 4px;
  }
  .run-item:hover { background: rgba(255,255,255,.03); }
  .run-item.active { border-color: rgba(79,140,255,.45); background: rgba(79,140,255,.08); }
  .run-item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .run-item code { font-size: 11px; color: var(--muted); }
  .run-item-goal {
    font-size: 12.5px; color: #cdd9ef; margin: 6px 0 4px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .run-item-meta { font-size: 11px; color: var(--muted); }

  .run-detail { padding: 16px; min-height: 500px; }
  .run-detail h2 { margin: 0; font-size: 16px; }
  .detail-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .detail-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .acceptance {
    margin-top: 14px; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; background: var(--panel-2); font-size: 12.5px; line-height: 1.7;
  }
  .acceptance.warn { border-color: rgba(251,191,36,.4); }
  .acceptance.err { border-color: rgba(248,113,113,.4); }
  .acceptance.ok { border-color: rgba(52,211,153,.35); }
  .task-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12.5px; }
  .task-table th {
    text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .05em;
    padding: 8px 8px; border-bottom: 1px solid var(--line);
  }
  .task-table td { padding: 9px 8px; border-bottom: 1px solid rgba(30,43,71,.55); vertical-align: top; }
  .task-table tr:last-child td { border-bottom: 0; }
  .task-name b { display: block; font-size: 12.5px; }
  .task-name small { color: var(--muted); }
  .task-files { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
  .task-files code { font-size: 10.5px; }

  .timeline { margin-top: 8px; max-height: 320px; overflow: auto; padding-right: 4px; }
  .tl-item {
    display: grid; grid-template-columns: 62px 14px minmax(0,1fr) auto;
    gap: 8px; align-items: start; padding: 5px 0; font-size: 12px;
  }
  .tl-time { color: #5f7296; font-variant-numeric: tabular-nums; font-size: 11px; padding-top: 2px; }
  .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; margin: 4px auto 0; }
  .tl-item.info .tl-dot { background: var(--accent); }
  .tl-item.warning .tl-dot { background: var(--warn); }
  .tl-item.error .tl-dot { background: var(--err); }
  .tl-msg { color: #c3d1ea; line-height: 1.55; word-break: break-word; }
  .tl-task {
    font-size: 10px; color: var(--muted); border: 1px solid var(--line);
    padding: 1px 6px; border-radius: 999px; align-self: start;
  }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }

  /* ---------- Self-Loop ---------- */
  .loop-summary { padding: 16px; margin-bottom: 14px; }
  .loop-summary h2 { margin: 0 0 10px; font-size: 15px; }
  .round-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .round-card { padding: 14px; }
  .round-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .round-head h3 { margin: 0; font-size: 13.5px; }
  .round-task {
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-top: 8px;
    background: var(--panel-2); font-size: 12px;
  }
  .round-task .rt-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .round-task small { color: var(--muted); font-size: 11px; }
  .round-task p { margin: 6px 0 0; color: #b9c8e4; font-size: 11.5px; line-height: 1.55; }
  .round-verdict { margin-top: 10px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
  .round-verdict b { color: var(--text); }
  .initial-tasks { margin-bottom: 14px; }

  @media (max-width: 1100px) {
    .canvas-layout { grid-template-columns: 1fr; }
    .inspector { min-height: 0; }
    .shell { grid-template-columns: 1fr; }
    .rail { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .runs-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>AgentOrch</h1>
        <p>多智能体编排调度平台 · 编排工作台</p>
      </div>
    </div>
    <div class="top-stats">
      <span class="pill" id="llmPill">连接中…</span>
      <span class="pill" id="teamPill">团队 —</span>
      <span class="pill" id="runPill">当前运行 —</span>
      <button id="refreshBtn">刷新</button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail">
      <button class="active" data-view="canvas">编排画布</button>
      <button data-view="team">团队面板</button>
      <button data-view="runs">运行监控</button>
      <button data-view="loop">Self-Loop</button>
    </nav>

    <main>
      <!-- 画布 -->
      <section id="view-canvas">
        <div class="panel toolbar">
          <input id="goalInput" type="text" value="做一个学生成绩管理系统的后端 API" />
          <select id="maxRounds" title="最大修复轮次">
            <option value="0">0 轮修复</option>
            <option value="1">1 轮修复</option>
            <option value="2">2 轮修复</option>
            <option value="3" selected>3 轮修复</option>
          </select>
          <select id="maxParallel" title="最大并行度">
            <option value="1">串行</option>
            <option value="2" selected>并行 2</option>
            <option value="3">并行 3</option>
          </select>
          <button class="primary" id="startBtn">启动运行</button>
          <span id="runHint" class="small muted"></span>
        </div>
        <div class="canvas-layout">
          <div class="panel canvas-wrap">
            <svg id="dag" role="img" aria-label="工作流 DAG"></svg>
          </div>
          <aside class="panel inspector" id="inspector">
            <div class="empty">点击画布节点查看步骤详情</div>
          </aside>
        </div>
      </section>

      <!-- 团队 -->
      <section id="view-team" hidden>
        <div class="team-grid" id="teamGrid"></div>
      </section>

      <!-- 运行 -->
      <section id="view-runs" hidden>
        <div class="runs-layout">
          <aside class="panel run-list" id="runList"></aside>
          <div class="panel run-detail" id="runDetail"></div>
        </div>
      </section>

      <!-- Self-Loop -->
      <section id="view-loop" hidden>
        <div class="panel loop-summary" id="loopSummary"></div>
        <div id="loopRounds"></div>
      </section>
    </main>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const els = {
  llmPill: $("llmPill"), teamPill: $("teamPill"), runPill: $("runPill"),
  goal: $("goalInput"), rounds: $("maxRounds"), parallel: $("maxParallel"),
  start: $("startBtn"), hint: $("runHint"), refresh: $("refreshBtn"),
  dag: $("dag"), inspector: $("inspector"),
  teamGrid: $("teamGrid"), runList: $("runList"), runDetail: $("runDetail"),
  loopSummary: $("loopSummary"), loopRounds: $("loopRounds"),
  views: {
    canvas: $("view-canvas"), team: $("view-team"),
    runs: $("view-runs"), loop: $("view-loop"),
  },
};

const state = {
  health: null, workflow: null, team: null,
  runs: [], run: null, selectedRunId: null, selectedStep: null,
  view: "canvas",
};

const RUN_LABEL = {
  pending: "排队", running: "运行中", completed: "完成",
  failed: "失败", rejected: "驳回", needs_revision: "待人工",
};
const TASK_LABEL = {
  pending: "待执行", running: "执行中", completed: "完成",
  failed: "失败", skipped: "跳过",
};
const ACCEPT_LABEL = {
  pending: "待验收", passed: "通过", rejected: "驳回", needs_revision: "需人工",
};

const plain = (value = "") => String(value).replace(/\*\*/g, "").replace(/`/g, "");
const esc = (value = "") => String(value).replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[ch]));

function fmtMs(ms) {
  if (ms === null || ms === undefined) return "—";
  if (ms < 1000) return `${ms}ms`;
  return `${(ms / 1000).toFixed(1)}s`;
}
function fmtTime(value) {
  if (!value) return "—";
  const date = new Date(value);
  return date.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtClock(value) {
  if (!value) return "";
  return new Date(value).toLocaleTimeString("zh-CN", { hour12: false });
}
function statusClass(status) {
  if (status === "completed" || status === "passed") return "pass";
  if (status === "running") return "run";
  if (status === "failed" || status === "rejected" || status === "needs_revision") return "err";
  if (status === "skipped") return "skip";
  return "";
}
function pill(status, labels) {
  const label = (labels && labels[status]) || status;
  return `<span class="pill ${statusClass(status)}">${esc(label)}</span>`;
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!response.ok) {
    let message = `HTTP ${response.status}`;
    try {
      const body = await response.json();
      message = body?.error?.message || JSON.stringify(body);
    } catch (_) { /* ignore */ }
    throw new Error(message);
  }
  return response.json();
}

/* ---------------- 初始化 ---------------- */
async function boot() {
  try {
    const [health, workflow, team, runs] = await Promise.all([
      api("/api/v1/health"),
      api("/api/v1/workflows/software_development"),
      api("/api/v1/team"),
      api("/api/v1/runs?limit=12"),
    ]);
    state.health = health;
    state.workflow = workflow;
    state.team = team;
    state.runs = runs;

    renderHeader();
    buildDag();
    renderTeam();
    renderRunsList();
    if (runs.length) {
      // 优先选最近的固定工作流运行，画布状态才能和步骤对上
      const initial = runs.find((run) => run.workflow) || runs[0];
      await selectRun(initial.id);
    } else {
      renderRunDetail();
      renderLoop();
    }
    setInterval(poll, 2000);
  } catch (error) {
    els.llmPill.textContent = "后端不可用";
    els.llmPill.className = "pill err";
    els.inspector.innerHTML = `<div class="empty">加载失败：${esc(error.message)}</div>`;
  }
}

function renderHeader() {
  if (state.health) {
    const mode = state.health.llm.mode;
    els.llmPill.textContent = mode === "live" ? "DeepSeek 已连接" : mode === "mock" ? "Mock 模式" : "未配置 Key";
    els.llmPill.className = `pill ${mode === "live" ? "ok" : mode === "mock" ? "warn" : "err"}`;
  }
  if (state.team) {
    els.teamPill.textContent = `${state.team.name} · ${state.team.members.length} 人`;
  }
  if (state.run) {
    els.runPill.textContent = `${state.run.id} · ${RUN_LABEL[state.run.status] || state.run.status}`;
    els.runPill.className = `pill ${statusClass(state.run.status)}`;
  } else {
    els.runPill.textContent = "当前运行 —";
    els.runPill.className = "pill";
  }
}

/* ---------------- 画布 ---------------- */
const NODE_W = 170, NODE_H = 64, GAP_X = 40, GAP_Y = 34, PAD_X = 30, PAD_Y = 42;
let dagPositions = {};

function buildDag() {
  const workflow = state.workflow;
  if (!workflow) return;
  const layers = workflow.layers;
  const stepByName = Object.fromEntries(workflow.steps.map((step) => [step.step_name, step]));

  const layerHeights = layers.map((layer) => layer.length * NODE_H + (layer.length - 1) * GAP_Y);
  const maxHeight = Math.max(...layerHeights);
  const width = PAD_X * 2 + layers.length * NODE_W + (layers.length - 1) * GAP_X;
  const height = maxHeight + PAD_Y * 2 + 20;

  dagPositions = {};
  layers.forEach((layer, layerIndex) => {
    const blockHeight = layer.length * NODE_H + (layer.length - 1) * GAP_Y;
    let y = PAD_Y + 14 + (maxHeight - blockHeight) / 2;
    layer.forEach((name) => {
      dagPositions[name] = { x: PAD_X + layerIndex * (NODE_W + GAP_X), y, layer: layerIndex };
      y += NODE_H + GAP_Y;
    });
  });

  const edges = [];
  workflow.steps.forEach((step) => {
    step.depends_on.forEach((dependency) => {
      const from = dagPositions[dependency];
      const to = dagPositions[step.step_name];
      if (!from || !to) return;
      const x1 = from.x + NODE_W, y1 = from.y + NODE_H / 2;
      const x2 = to.x, y2 = to.y + NODE_H / 2;
      const curve = Math.max(28, (x2 - x1) / 2);
      edges.push(`<path class="edge" data-from="${esc(dependency)}" data-to="${esc(step.step_name)}"
        d="M ${x1} ${y1} C ${x1 + curve} ${y1}, ${x2 - curve} ${y2}, ${x2} ${y2}" marker-end="url(#arrow)" />`);
    });
  });

  const layerLabels = layers.map((layer, index) => {
    const x = PAD_X + index * (NODE_W + GAP_X);
    return `<text class="layer-label" x="${x}" y="${PAD_Y - 12}">L${index + 1}</text>`;
  }).join("");

  const nodes = layers.flat().map((name) => {
    const step = stepByName[name];
    const position = dagPositions[name];
    const agent = state.team?.members.find((member) => member.id === step.agent);
    return `<g class="node status-pending" data-step="${esc(name)}" transform="translate(${position.x}, ${position.y})">
      <rect class="node-bg" width="${NODE_W}" height="${NODE_H}" rx="12" />
      <circle class="node-dot" cx="18" cy="22" r="5" />
      <text class="node-title" x="32" y="26">${esc(name)}</text>
      <text class="node-sub" x="16" y="48">${esc(agent?.display_name || step.agent)} · L${position.layer + 1}</text>
    </g>`;
  }).join("");

  els.dag.setAttribute("viewBox", `0 0 ${width} ${height}`);
  els.dag.setAttribute("preserveAspectRatio", "xMidYMid meet");
  els.dag.innerHTML = `<defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#33456b"></path>
      </marker>
    </defs>
    ${layerLabels}
    <g id="edgeLayer">${edges.join("")}</g>
    <g id="nodeLayer">${nodes}</g>`;

  els.dag.querySelectorAll(".node").forEach((node) => {
    node.addEventListener("click", () => {
      state.selectedStep = node.dataset.step;
      document.querySelectorAll(".node").forEach((item) => item.classList.remove("selected"));
      node.classList.add("selected");
      renderInspector();
    });
  });
  updateDagStatuses();
}

function taskForStep(stepName) {
  if (!state.run) return null;
  return state.run.tasks.find((task) => task.spec.title === stepName) || null;
}

function updateDagStatuses() {
  if (!state.workflow) return;
  els.dag.querySelectorAll(".node").forEach((node) => {
    const task = taskForStep(node.dataset.step);
    node.classList.remove("status-pending", "status-running", "status-completed", "status-failed", "status-skipped");
    node.classList.add(`status-${task ? task.status : "pending"}`);
  });
  els.dag.querySelectorAll(".edge").forEach((edge) => {
    const target = taskForStep(edge.dataset.to);
    edge.classList.toggle("active", Boolean(target && target.status !== "pending"));
  });
}

function renderInspector() {
  const name = state.selectedStep;
  if (!name) {
    els.inspector.innerHTML = `<div class="empty">点击画布节点查看步骤详情</div>`;
    return;
  }
  const step = state.workflow.steps.find((item) => item.step_name === name);
  const agent = state.team.members.find((member) => member.id === step.agent);
  const task = taskForStep(name);
  const status = task ? task.status : "pending";
  const tools = (agent?.allowed_tools || []).map((tool) =>
    `<span class="chip ${tool.implemented ? "on" : "off"}" title="${esc(tool.description)}">${esc(tool.display_name)}</span>`
  ).join("");

  els.inspector.innerHTML = `
    <h3>${esc(step.step_name)} ${pill(status, TASK_LABEL)}</h3>
    <div class="role">${esc(agent?.display_name || step.agent)} · ${esc(step.agent)}</div>
    <section>
      <h4>依赖</h4>
      <div class="chips">${step.depends_on.length ? step.depends_on.map((item) => `<span class="chip">${esc(item)}</span>`).join("") : '<span class="muted small">无（首层）</span>'}</div>
    </section>
    <section>
      <h4>工具权限</h4>
      <div class="chips">${tools}</div>
    </section>
    ${task ? `
      <section>
        <h4>本次执行</h4>
        <div class="kv"><span>耗时</span><span>${fmtMs(task.duration_ms)}</span></div>
        <div class="kv"><span>Token</span><span>${task.usage?.total_tokens ?? 0}</span></div>
        <div class="kv"><span>文件</span><span>${task.files?.length || 0} 个</span></div>
        ${task.test_result ? `<div class="kv"><span>pytest</span><span>退出码 ${task.test_result.exit_code}</span></div>` : ""}
      </section>
      ${task.error ? `<section><h4>错误</h4><div class="preview">${esc(task.error)}</div></section>` : ""}
      ${task.output ? `<section><h4>输出摘要</h4><div class="preview">${esc(task.output.slice(0, 700))}</div></section>` : ""}
    ` : ""}
  `;
}

/* ---------------- 团队 ---------------- */
function renderTeam() {
  const members = state.team?.members || [];
  els.teamGrid.innerHTML = members.map((member) => {
    const initials = member.display_name.slice(0, 2);
    const tools = member.allowed_tools.map((tool) =>
      `<span class="chip ${tool.implemented ? "on" : "off"}" title="${esc(tool.description)}">${esc(tool.name)}</span>`
    ).join("");
    return `<article class="panel agent-card">
      <div class="agent-head">
        <div class="avatar">${esc(initials)}</div>
        <div><h3>${esc(member.display_name)}</h3><p>${esc(member.id)}</p></div>
      </div>
      <p class="agent-desc">${esc(member.description)}</p>
      <div class="chips">${tools}</div>
      <details>
        <summary>System Prompt</summary>
        <pre>${esc(member.system_prompt)}</pre>
      </details>
    </article>`;
  }).join("");
}

/* ---------------- 运行列表 / 详情 ---------------- */
function renderRunsList() {
  els.runList.innerHTML = state.runs.length ? state.runs.map((run) => `
    <button class="run-item ${run.id === state.selectedRunId ? "active" : ""}" data-run="${esc(run.id)}">
      <div class="run-item-top">
        ${pill(run.status, RUN_LABEL)}
        <code>${esc(run.id)}</code>
      </div>
      <div class="run-item-goal">${esc(run.goal || "（手动任务清单）")}</div>
      <div class="run-item-meta">${run.completed}/${run.total} 完成 · 修复 ${run.rounds} 轮 · ${fmtTime(run.created_at)}</div>
    </button>
  `).join("") : `<div class="empty">还没有运行记录</div>`;
}

function renderRunDetail() {
  const run = state.run;
  if (!run) {
    els.runDetail.innerHTML = `<div class="empty">选择左侧运行查看详情，或在编排画布启动一次运行</div>`;
    return;
  }
  const acceptance = run.acceptance || {};
  const acceptanceClass = acceptance.status === "passed" ? "ok" : acceptance.status === "rejected" || acceptance.status === "needs_revision" ? "err" : "";
  const tasks = run.tasks.map((task) => `
    <tr>
      <td class="task-name"><b>${esc(task.spec.id)}</b><small>${esc(task.spec.title)}</small></td>
      <td>${esc(task.agent_name || task.spec.owner)}</td>
      <td>${pill(task.status, TASK_LABEL)}</td>
      <td>${fmtMs(task.duration_ms)}</td>
      <td>${task.usage?.total_tokens ?? 0}</td>
      <td>${task.test_result ? `<span class="pill ${task.test_result.exit_code === 0 ? "pass" : "err"}">${task.test_result.exit_code}</span>` : "—"}</td>
      <td><div class="task-files">${(task.files || []).slice(0, 4).map((file) => `<code>${esc(file)}</code>`).join("") || "—"}${(task.files || []).length > 4 ? `<span>… ${task.files.length - 4} 个</span>` : ""}</div></td>
    </tr>
  `).join("");

  const logs = (run.logs || []).slice(-80).map((log) => `
    <div class="tl-item ${log.level}">
      <span class="tl-time">${fmtClock(log.at)}</span>
      <span class="tl-dot"></span>
      <span class="tl-msg">${esc(log.message)}</span>
      ${log.task_id ? `<code class="tl-task">${esc(log.task_id)}</code>` : ""}
    </div>
  `).join("");

  els.runDetail.innerHTML = `
    <div class="detail-head">
      <div>
        <h2>${esc(run.id)}</h2>
        <div class="small muted" style="margin-top:4px">${esc(run.goal || "手动任务清单")}</div>
      </div>
      <div class="small muted">${fmtTime(run.created_at)}</div>
    </div>
    <div class="detail-pills">
      ${pill(run.status, RUN_LABEL)}
      <span class="pill">执行 ${esc(run.execution_status)}</span>
      ${pill(acceptance.status, ACCEPT_LABEL)}
      <span class="pill">修复 ${run.rounds} 轮</span>
      ${run.needs_human ? '<span class="pill err">需人工介入</span>' : ""}
    </div>
    <div class="acceptance ${acceptanceClass}">
      <b>验收结论：</b>${esc(acceptance.verdict || "未给出")} · ${esc(ACCEPT_LABEL[acceptance.status] || acceptance.status || "待验收")}
      ${acceptance.summary ? `<div style="margin-top:6px;color:#b9c8e4">${esc(plain(acceptance.summary.slice(0, 600)))}</div>` : ""}
    </div>
    <table class="task-table">
      <thead><tr><th>步骤</th><th>Agent</th><th>状态</th><th>耗时</th><th>Token</th><th>pytest</th><th>交付文件</th></tr></thead>
      <tbody>${tasks}</tbody>
    </table>
    <section style="margin-top:18px">
      <h4 style="margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">执行时间线</h4>
      <div class="timeline">${logs || '<div class="muted small">暂无日志</div>'}</div>
    </section>
  `;
}

/* ---------------- Self-Loop ---------------- */
function roundTasks(run) {
  const rounds = new Map();
  const initial = [];
  for (const task of run.tasks) {
    const match = task.spec.id.match(/^R(\d+)-(fix|test|review)$/);
    if (!match) {
      initial.push(task);
      continue;
    }
    const round = Number(match[1]);
    if (!rounds.has(round)) rounds.set(round, {});
    rounds.get(round)[match[2]] = task;
  }
  return { initial, rounds: [...rounds.entries()].sort((a, b) => a[0] - b[0]) };
}

function roundVerdict(run, round) {
  const prefix = `第 ${round} 轮复评：`;
  const log = (run.logs || []).find((item) => item.message.startsWith(prefix));
  return log ? log.message.slice(prefix.length) : "—";
}

function renderLoop() {
  const run = state.run;
  if (!run) {
    els.loopSummary.innerHTML = `<div class="empty">选择一次运行后查看 Self-Loop 轮次</div>`;
    els.loopRounds.innerHTML = "";
    return;
  }
  const { initial, rounds } = roundTasks(run);
  const acceptance = run.acceptance || {};
  const needsHuman = run.needs_human ? '<span class="pill err">需人工介入</span>' : '<span class="pill pass">无需人工</span>';

  els.loopSummary.innerHTML = `
    <h2>${esc(run.id)} · Self-Loop</h2>
    <div class="detail-pills">
      ${pill(run.status, RUN_LABEL)}
      <span class="pill">修复 ${run.rounds} 轮</span>
      ${pill(acceptance.status, ACCEPT_LABEL)}
      ${needsHuman}
    </div>
    <div class="small muted" style="margin-top:10px">
      ${acceptance.summary ? esc(plain(acceptance.summary.slice(0, 300))) : "首轮执行 → 评审/测试失败 → 修复 → 重测 → 复评"}
    </div>
  `;

  const initialHtml = `
    <div class="panel round-card initial-tasks">
      <div class="round-head"><h3>首轮执行</h3><span class="pill">${initial.length} 个任务</span></div>
      ${initial.map((task) => `
        <div class="round-task">
          <div class="rt-top"><b>${esc(task.spec.id)} · ${esc(task.spec.title)}</b>${pill(task.status, TASK_LABEL)}</div>
          <small>${esc(task.agent_name || task.spec.owner)} · ${fmtMs(task.duration_ms)} · ${task.usage?.total_tokens ?? 0} tokens</small>
          ${task.test_result ? `<p>pytest 退出码 ${task.test_result.exit_code}</p>` : ""}
        </div>
      `).join("")}
    </div>`;

  const roundsHtml = rounds.map(([number, group]) => {
    const verdict = roundVerdict(run, number);
    const renderTask = (key, label) => {
      const task = group[key];
      if (!task) return "";
      return `<div class="round-task">
        <div class="rt-top"><b>${label} · ${esc(task.spec.id)}</b>${pill(task.status, TASK_LABEL)}</div>
        <small>${esc(task.agent_name || task.spec.owner)} · ${fmtMs(task.duration_ms)} · ${task.usage?.total_tokens ?? 0} tokens</small>
        ${task.test_result ? `<p>pytest 退出码 ${task.test_result.exit_code}</p>` : ""}
        ${task.output ? `<p>${esc(task.output.slice(0, 160).replace(/\n/g, " "))}…</p>` : ""}
      </div>`;
    };
    return `<div class="panel round-card">
      <div class="round-head"><h3>第 ${number} 轮修复</h3><span class="pill">${Object.keys(group).length} 个任务</span></div>
      ${renderTask("fix", "修复")}
      ${renderTask("test", "重测")}
      ${renderTask("review", "复评")}
      <div class="round-verdict">复评结论：<b>${esc(verdict)}</b></div>
    </div>`;
  }).join("");

  els.loopRounds.innerHTML = `<div class="round-grid">${initialHtml}${roundsHtml || ""}</div>`;
}

/* ---------------- 交互 ---------------- */
function switchView(view) {
  state.view = view;
  Object.entries(els.views).forEach(([key, element]) => { element.hidden = key !== view; });
  document.querySelectorAll(".rail button").forEach((button) => {
    button.classList.toggle("active", button.dataset.view === view);
  });
  if (view === "runs") renderRunDetail();
  if (view === "loop") renderLoop();
}

document.querySelectorAll(".rail button").forEach((button) => {
  button.addEventListener("click", () => switchView(button.dataset.view));
});

els.start.addEventListener("click", async () => {
  const goal = els.goal.value.trim();
  if (!goal) return;
  els.start.disabled = true;
  els.hint.textContent = "创建运行中…";
  try {
    const run = await api("/api/v1/workflows/software_development/runs", {
      method: "POST",
      body: JSON.stringify({
        goal,
        max_repair_rounds: Number(els.rounds.value),
        max_parallel: Number(els.parallel.value),
      }),
    });
    state.run = run;
    state.selectedRunId = run.id;
    state.runs = await api("/api/v1/runs?limit=12");
    renderHeader();
    renderRunsList();
    renderRunDetail();
    renderLoop();
    updateDagStatuses();
    els.hint.textContent = `已启动 ${run.id}`;
    switchView("canvas");
  } catch (error) {
    els.hint.textContent = `启动失败：${error.message}`;
  } finally {
    els.start.disabled = false;
  }
});

els.runList.addEventListener("click", (event) => {
  const item = event.target.closest("[data-run]");
  if (item) selectRun(item.dataset.run);
});

els.refresh.addEventListener("click", async () => {
  try {
    state.runs = await api("/api/v1/runs?limit=12");
    if (state.selectedRunId) state.run = await api(`/api/v1/runs/${state.selectedRunId}`);
    renderHeader();
    renderRunsList();
    renderRunDetail();
    renderLoop();
    updateDagStatuses();
    renderInspector();
  } catch (error) {
    els.hint.textContent = `刷新失败：${error.message}`;
  }
});

async function selectRun(runId) {
  state.selectedRunId = runId;
  try {
    state.run = await api(`/api/v1/runs/${runId}`);
  } catch (_) {
    state.run = null;
  }
  renderHeader();
  renderRunsList();
  renderRunDetail();
  renderLoop();
  updateDagStatuses();
  renderInspector();
}

async function poll() {
  try {
    state.runs = await api("/api/v1/runs?limit=12");
    if (state.selectedRunId) {
      state.run = await api(`/api/v1/runs/${state.selectedRunId}`);
    }
    renderHeader();
    renderRunsList();
    if (state.view === "runs") renderRunDetail();
    if (state.view === "loop") renderLoop();
    updateDagStatuses();
    if (state.selectedStep) renderInspector();
  } catch (_) {
    /* 网络抖动时静默，下一次轮询重试 */
  }
}

boot();
</script>
</body>
</html>
